<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>StreamEngine 拓扑监控</title>
<style>
body { font-family: "Microsoft YaHei", sans-serif; margin: 24px; background: #f5f7fa; color: #22303f; }
h1 { font-size: 22px; }
.panel { background: #fff; border: 1px solid #d8dee6; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid #d8dee6; padding: 6px 10px; text-align: left; font-size: 13px; }
th { background: #eef2f6; }
.ok { color: #16825d; font-weight: bold; }
</style>
</head>
<body>
<h1>StreamEngine 拓扑监控</h1>
<div class="panel">
  <p>状态：<span id="state" class="ok">加载中</span></p>
  <p>水位线（当前 / 已确认）：<span id="watermark">-</span></p>
  <p>分区：<span id="partitions">-</span>　缓冲记录：<span id="buffered">-</span>　状态键：<span id="stateKeys">-</span></p>
</div>
<div class="panel">
  <h2>指标</h2>
  <table id="metrics"><thead><tr><th>指标</th><th>数值</th></tr></thead><tbody></tbody></table>
</div>
<div class="panel">
  <h2>算子实例</h2>
  <table id="operators"><thead><tr><th>算子</th><th>状态</th></tr></thead><tbody></tbody></table>
</div>
<div class="panel">
  <h2>窗口</h2>
  <table id="windows"><thead><tr><th>窗口</th><th>状态</th></tr></thead><tbody></tbody></table>
</div>
<script>
async function refresh() {
  try {
    const resp = await fetch("/api/status");
    const data = await resp.json();
    document.getElementById("state").textContent = "运行中";
    document.getElementById("watermark").textContent =
      data.watermark.current + " / " + data.watermark.confirmed;
    document.getElementById("partitions").textContent = data.partitions.count;
    document.getElementById("buffered").textContent = data.buffered;
    document.getElementById("stateKeys").textContent = data.state_keys;
    const metricsBody = document.querySelector("#metrics tbody");
    metricsBody.innerHTML = "";
    for (const [name, value] of Object.entries(data.metrics)) {
      const row = document.createElement("tr");
      row.innerHTML = "<td>" + name + "</td><td>" + value + "</td>";
      metricsBody.appendChild(row);
    }
    const operatorsBody = document.querySelector("#operators tbody");
    operatorsBody.innerHTML = "";
    for (const [name, value] of Object.entries(data.operators)) {
      const row = document.createElement("tr");
      row.innerHTML = "<td>" + name + "</td><td>" + value + "</td>";
      operatorsBody.appendChild(row);
    }
    const windowsBody = document.querySelector("#windows tbody");
    windowsBody.innerHTML = "";
    for (const [name, value] of Object.entries(data.windows)) {
      const row = document.createElement("tr");
      row.innerHTML = "<td>" + name + "</td><td>" + value + "</td>";
      windowsBody.appendChild(row);
    }
  } catch (err) {
    document.getElementById("state").textContent = "连接失败: " + err;
  }
}
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
